name: Deploy comic portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://szvqkzqzojleqkcukvnl.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6dnFrenF6b2psZXFrY3Vrdm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTI2NzMsImV4cCI6MjA5NDA4ODY3M30.DdxoVzuWN6w51qq-MsurdCz6A_Cmib5Zi59oIWgzcQE
      VITE_ADMIN_EMAILS: dlukematthew@gmail.com
      VITE_GOOGLE_ADSENSE_CLIENT: ca-pub-5988541962777922
      VITE_GOOGLE_ADSENSE_TOP_SLOT: 7063438697
      VITE_GOOGLE_ADSENSE_CATALOG_SLOT: 7063438697
      VITE_GOOGLE_ADSENSE_BOTTOM_SLOT: 7063438697

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy index as 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4